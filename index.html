<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roget’s Thesaurus, 1911 — Search</title>
<meta name="description" content="Search every word in the 1911 Roget’s Thesaurus (Project Gutenberg ebook 10681). Works offline.">
<style>
:root {
  --bg: #f3efe6;
  --bg-2: #fbf8f1;
  --ink: #241f1a;
  --muted: #6e655a;
  --faint: #9a9084;
  --line: #e2d8c8;
  --accent: #7a2e3a;
  --accent-2: #3e5a4c;
  --mark: #f6d889;
  --mark-ink: #3a2a00;
  --shadow: 0 1px 2px rgba(36,31,26,.06), 0 8px 24px rgba(36,31,26,.06);
  --radius: 14px;
  --sidebar: 300px;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
}
html[data-theme="dark"] {
  --bg: #1a1815;
  --bg-2: #23201c;
  --ink: #f0e9de;
  --muted: #b0a89c;
  --faint: #8a8276;
  --line: #3a3530;
  --accent: #e8b4bc;
  --accent-2: #a9c4b4;
  --mark: #7a5a16;
  --mark-ink: #ffe9a8;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.28);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--ink);
  line-height: 1.5;
  min-height: 100vh;
}
button, input { font: inherit; color: inherit; }
a { color: var(--accent); }
mark {
  background: var(--mark);
  color: var(--mark-ink);
  padding: 0 .12em;
  border-radius: 2px;
}
.word {
  cursor: pointer;
  border-radius: 2px;
}
.word:hover { background: color-mix(in srgb, var(--accent) 16%, transparent); }
header.app {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.header-inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 12px 20px 14px;
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}
.toprow {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.brand h1 {
  font-family: var(--serif);
  font-weight: 600;
  font-size: 1.25rem;
  letter-spacing: .01em;
  margin: 0;
}
.brand h1 em { font-style: italic; font-weight: 500; }
.brand p { margin: 0; color: var(--muted); font-size: .8rem; }
.iconbtn {
  border: 1px solid var(--line);
  background: var(--bg-2);
  width: 38px; height: 38px;
  border-radius: 10px;
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
}
.iconbtn:hover { border-color: var(--accent); }
.searchwrap { position: relative; }
.searchwrap input {
  width: 100%;
  border: 1px solid var(--line);
  background: var(--bg-2);
  border-radius: 999px;
  padding: 12px 44px 12px 44px;
  outline: none;
  box-shadow: var(--shadow);
}
.searchwrap input:focus { border-color: var(--accent); }
.search-icon, .search-clear {
  position: absolute; top: 50%; transform: translateY(-50%);
  color: var(--muted);
  background: none; border: 0; padding: 0;
}
.search-icon { left: 16px; pointer-events: none; }
.search-clear { right: 14px; cursor: pointer; display: none; }
.searchwrap.has-query .search-clear { display: block; }

.layout {
  max-width: 1280px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: var(--sidebar) 1fr;
  gap: 0;
  min-height: calc(100vh - 120px);
}
.sidebar {
  border-right: 1px solid var(--line);
  padding: 16px 12px 40px 20px;
}
.sidebar h2 {
  font-size: .72rem;
  text-transform: uppercase;
  letter-spacing: .12em;
  color: var(--faint);
  margin: 8px 8px 10px;
}
.tree { font-size: .86rem; }
.tree details { margin-bottom: 2px; }
.tree summary {
  cursor: pointer;
  list-style: none;
  padding: 5px 8px;
  border-radius: 8px;
  color: var(--ink);
  font-weight: 600;
}
.tree summary::-webkit-details-marker { display: none; }
.tree summary::before { content: "▸ "; color: var(--faint); font-weight: 400; }
.tree details[open] > summary::before { content: "▾ "; }
.tree summary:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.tree .sec summary { font-weight: 500; color: var(--muted); padding-left: 16px; }
.tree .cats { margin: 0 0 6px 10px; padding: 0; list-style: none; }
.tree .cats button {
  display: block; width: 100%;
  text-align: left;
  background: none; border: 0;
  padding: 3px 8px 3px 22px;
  border-radius: 6px;
  cursor: pointer;
  color: var(--ink);
  line-height: 1.35;
}
.tree .cats button:hover, .tree .cats button.active {
  background: color-mix(in srgb, var(--accent) 12%, transparent);
}
.tree .num { color: var(--faint); font-variant-numeric: tabular-nums; margin-right: .35em; }

main { padding: 20px 24px 80px; min-width: 0; }
.status {
  color: var(--muted);
  font-size: .92rem;
  margin: 0 0 16px;
}
.status strong { color: var(--ink); }
.card {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 18px 14px;
  margin: 0 0 12px;
  box-shadow: var(--shadow);
}
.card-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.card-head h3 {
  font-family: var(--serif);
  font-size: 1.2rem;
  margin: 0;
  font-weight: 600;
}
.card-head h3 a {
  color: inherit; text-decoration: none;
}
.card-head h3 a:hover { color: var(--accent); }
.crumb { color: var(--muted); font-size: .8rem; margin: 4px 0 10px; }
.pos {
  display: inline-block;
  font-size: .68rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--accent-2);
  margin: 10px 0 4px;
}
.para {
  font-family: var(--serif);
  font-size: 1.02rem;
  line-height: 1.55;
  margin: 0 0 6px;
}
.toggle {
  margin-top: 8px;
  background: none;
  border: 0;
  color: var(--accent);
  cursor: pointer;
  padding: 0;
  font-size: .85rem;
}
.full { display: none; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
.card.expanded .full { display: block; }
.card.expanded .snippet { display: none; }
.more {
  display: inline-block;
  margin: 8px 0 0;
  padding: 8px 16px;
  border: 1px solid var(--line);
  background: var(--bg-2);
  border-radius: 999px;
  cursor: pointer;
}
.empty {
  padding: 48px 12px;
  text-align: center;
  color: var(--muted);
}
.empty h2 { font-family: var(--serif); color: var(--ink); font-weight: 500; margin: 0 0 8px; }
.term-list { margin: 0 0 16px; }
.term-list button {
  margin: 0 6px 6px 0;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg-2);
  cursor: pointer;
}
.term-list button:hover { border-color: var(--accent); }
.loading { padding: 60px 20px; text-align: center; color: var(--muted); }
.error { padding: 40px 20px; color: #9b1c1c; }

.burger { display: none; }
.backdrop { display: none; }

footer.note {
  max-width: 1280px;
  margin: 0 auto;
  padding: 8px 24px 28px;
  color: var(--faint);
  font-size: .75rem;
}

@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar {
    display: none;
    position: fixed; inset: 0 auto 0 0;
    width: min(88vw, 340px);
    background: var(--bg);
    z-index: 30;
    overflow: auto;
    box-shadow: var(--shadow);
  }
  .sidebar.open { display: block; }
  .backdrop.open {
    display: block;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.4);
    z-index: 25;
  }
  .burger { display: inline-flex; }
  .navlink { padding: 8px 6px; font-size: .8rem; }
  main { padding: 16px 16px 80px; }
}

.navlink {
  font-size: .85rem;
  color: var(--accent);
  text-decoration: none;
  padding: 8px 10px;
  white-space: nowrap;
  border-radius: 8px;
}
.navlink:hover { text-decoration: underline; background: color-mix(in srgb, var(--accent) 10%, transparent); }
</style>
</head>

const POS_LABEL = { N: "Nouns", V: "Verbs", Adj: "Adjectives", Adv: "Adverbs", Phr: "Phrases", Int: "Interjections" };
const WORD_RE = /[A-Za-z][A-Za-z']*(?:-[A-Za-z']+)*/g;
const PAGE = 40;

const state = {
  data: null,
  index: null,      // Map word -> packed postings
  vocab: null,      // sorted words
  byNum: null,      // num -> cat index
  names: null,      // [{i, name, lname}]
  ready: false,
  lastQuery: "",
  shown: 0,
  current: null
};

function pretty(s) {
  return s.replace(/[A-Za-z.]+/g, w => {
    const roman = w.match(/^([IVX]+)(\.?)$/);
    if (roman) return w;
    if (/^[A-Z][A-Z'&,]*$/.test(w) && w.length > 1) return w.charAt(0) + w.slice(1).toLowerCase();
    return w;
  });
}
function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function wordsIn(text) {
  const out = [];
  const s = text.replace(/[’‘]/g, "'");
  let m;
  const re = new RegExp(WORD_RE.source, "g");
  while ((m = re.exec(s))) out.push(m[0].toLowerCase());
  return out;
}
function unique(arr) { return Array.from(new Set(arr)); }

async function gunzipB64(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  if (typeof DecompressionStream !== "function") {
    throw new Error("This browser cannot unpack the thesaurus. Please use a current version of Chrome, Firefox, Safari, or Edge.");
  }
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  const buf = await new Response(stream).arrayBuffer();
  return new TextDecoder().decode(buf);
}

function pack(ci, pi) { return (ci << 4) | pi; }
function unpack(p) { return [p >> 4, p & 15]; }

function buildIndex(data) {
  const index = new Map();
  const add = (w, packed) => {
    let a = index.get(w);
    if (!a) { a = []; index.set(w, a); }
    a.push(packed);
  };
  const cats = data.cats;
  for (let i = 0; i < cats.length; i++) {
    const paras = cats[i][4];
    const nameWords = unique(wordsIn(cats[i][1]));
    for (const w of nameWords) add(w, pack(i, 15)); // 15 = name slot
    for (let p = 0; p < paras.length; p++) {
      for (const w of unique(wordsIn(paras[p][1]))) add(w, pack(i, p));
    }
  }
  const vocab = Array.from(index.keys()).sort();
  const byNum = new Map();
  const names = [];
  for (let i = 0; i < cats.length; i++) {
    byNum.set(String(cats[i][0]).toLowerCase(), i);
    names.push({ i, name: cats[i][1], lname: cats[i][1].toLowerCase() });
  }
  return { index, vocab, byNum, names };
}

function prefixRange(vocab, prefix) {
  // binary search first index
  let lo = 0, hi = vocab.length;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (vocab[mid] < prefix) lo = mid + 1; else hi = mid;
  }
  const start = lo;
  const endBound = prefix + "\uffff";
  lo = start; hi = vocab.length;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (vocab[mid] <= endBound) lo = mid + 1; else hi = mid;
  }
  return vocab.slice(start, lo);
}

function wholeWordRe(q) {
  const parts = q.trim().split(/\s+/).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  const body = parts.join("\\s+");
  return new RegExp("(?<![A-Za-z'])" + body + "(?![A-Za-z'])", "gi");
}

function textHasQuery(text, q) {
  return wholeWordRe(q).test(text);
}

function catMeta(cat) {
  const d = state.data;
  return {
    num: cat[0],
    name: cat[1],
    classLabel: pretty(d.classes[cat[2]]),
    sectionLabel: pretty(d.sections[cat[3]]),
    paras: cat[4]
  };
}

function search(raw) {
  const q = raw.trim();
  if (!q) return { type: "empty", q };
  const ql = q.toLowerCase().replace(/[’‘]/g, "'");
  const cats = state.data.cats;
  const hits = new Map(); // catIdx -> { reasons, paras:Set, name:bool }

  const bump = (i, reason, pi) => {
    let h = hits.get(i);
    if (!h) { h = { reasons: new Set(), paras: new Set(), name: false }; hits.set(i, h); }
    h.reasons.add(reason);
    if (pi === 15) h.name = true;
    else if (pi != null && pi >= 0) h.paras.add(pi);
  };

  // Category number
  const numKey = ql.replace(/^#/, "");
  if (state.byNum.has(numKey)) bump(state.byNum.get(numKey), "number", 15);

  // Category name
  for (const n of state.names) {
    if (n.lname === ql) bump(n.i, "name-exact", 15);
    else if (textHasQuery(n.lname, ql)) bump(n.i, "name", 15);
    else if (ql.length >= 4 && n.lname.startsWith(ql)) bump(n.i, "name", 15);
  }

  // Exact word / phrase as whole word in indexed terms
  if (ql.indexOf(" ") === -1) {
    const post = state.index.get(ql);
    if (post) for (const p of post) {
      const [ci, pi] = unpack(p);
      bump(ci, "word", pi);
    }
  } else {
    // multi-word: scan postings of the rarest word, then filter
    const toks = unique(wordsIn(ql));
    if (toks.length) {
      let smallest = null;
      for (const t of toks) {
        const post = state.index.get(t);
        if (!post) { smallest = []; break; }
        if (!smallest || post.length < smallest.length) smallest = post;
      }
      const seen = new Set();
      for (const p of smallest || []) {
        const [ci, pi] = unpack(p);
        const key = ci + ":" + pi;
        if (seen.has(key)) continue;
        seen.add(key);
        const cat = cats[ci];
        const text = pi === 15 ? cat[1] : (cat[4][pi] ? cat[4][pi][1] : "");
        if (textHasQuery(text, ql)) bump(ci, "phrase", pi);
      }
    }
  }

  if (hits.size) {
    const list = Array.from(hits.entries()).sort((a, b) => {
      const ra = a[1].reasons, rb = b[1].reasons;
      const rank = h => h.reasons.has("number") ? 0 : h.reasons.has("name-exact") ? 1 : h.reasons.has("name") ? 2 : 3;
      const d = rank(a[1]) - rank(b[1]);
      return d || a[0] - b[0];
    });
    return { type: "exact", q, ql, list };
  }

  // Fallback: starts-with, then partial
  if (ql.length >= 2) {
    const starts = prefixRange(state.vocab, ql).slice(0, 40);
    if (starts.length) {
      const list = [];
      const seenCat = new Set();
      for (const term of starts) {
        for (const p of state.index.get(term)) {
          const [ci, pi] = unpack(p);
          if (seenCat.has(ci)) continue;
          seenCat.add(ci);
          list.push([ci, { reasons: new Set(["prefix"]), paras: new Set(pi === 15 ? [] : [pi]), name: pi === 15, term }]);
          if (list.length >= 80) break;
        }
        if (list.length >= 80) break;
      }
      return { type: "prefix", q, ql, terms: starts, list };
    }
    const partial = [];
    for (const w of state.vocab) {
      if (w.includes(ql) && w !== ql) {
        partial.push(w);
        if (partial.length >= 40) break;
      }
    }
    if (partial.length) {
      const list = [];
      const seenCat = new Set();
      for (const term of partial) {
        for (const p of state.index.get(term)) {
          const [ci, pi] = unpack(p);
          if (seenCat.has(ci)) continue;
          seenCat.add(ci);
          list.push([ci, { reasons: new Set(["partial"]), paras: new Set(pi === 15 ? [] : [pi]), name: pi === 15, term }]);
          if (list.length >= 80) break;
        }
        if (list.length >= 80) break;
      }
      return { type: "partial", q, ql, terms: partial, list };
    }
  }
  return { type: "none", q, ql };
}

function renderHighlighted(text, q, clickable) {
  const src = esc(text);
  // Work on escaped text; highlight first, then wrap remaining words.
  // Simpler: tokenize original, emit escaped pieces.
  const needle = q ? q.toLowerCase().replace(/[’‘]/g, "'") : "";
  const re = needle ? wholeWordRe(needle) : null;
  let html = "";
  let last = 0;
  const s = text;
  const wrapWord = (chunk, hi) => {
    const wr = new RegExp(WORD_RE.source, "g");
    let out = "", lastW = 0, mm;
    while ((mm = wr.exec(chunk))) {
      out += esc(chunk.slice(lastW, mm.index));
      const inner = hi ? "<mark>" + esc(mm[0]) + "</mark>" : esc(mm[0]);
      if (clickable) {
        out += '<span class="word" data-q="' + esc(mm[0]) + '" title="Search \'' + esc(mm[0]) + '\'">' + inner + "</span>";
      } else {
        out += inner;
      }
      lastW = mm.index + mm[0].length;
    }
    return out + esc(chunk.slice(lastW));
  };
  if (!needle) return wrapWord(s, false);
  const r = wholeWordRe(needle);
  while ((m = r.exec(s))) {
    if (m.index > last) html += wrapWord(s.slice(last, m.index), false);
    html += wrapWord(m[0], true);
    last = m.index + m[0].length;
  }
  if (last < s.length) html += wrapWord(s.slice(last), false);
  return html;
}

function renderParas(paras, q, onlySet) {
  let html = "";
  paras.forEach((pair, i) => {
    if (onlySet && onlySet.size && !onlySet.has(i)) return;
    const [k, t] = pair;
    html += '<div class="pos">' + esc(POS_LABEL[k] || k) + "</div>";
    html += '<div class="para">' + renderHighlighted(t, q, true) + "</div>";
  });
  return html;
}

function cardHtml(catIdx, hit, q, startExpanded) {
  const cat = state.data.cats[catIdx];
  const m = catMeta(cat);
  const only = hit && hit.paras ? hit.paras : new Set();
  const hasSnippets = only.size > 0;
  const expanded = startExpanded || (hit && hit.reasons && hit.reasons.has("number") && !hasSnippets);
  const title = renderHighlighted(m.num + ". " + m.name, q, false);
  let html = '<article class="card' + (expanded ? " expanded" : "") + '" data-cat="' + catIdx + '">';
  html += '<div class="card-head"><h3><a href="#cat=' + encodeURIComponent(m.num) + '">' + title + "</a></h3></div>";
  html += '<div class="crumb">' + esc(m.classLabel) + " · " + esc(m.sectionLabel) + "</div>";
  if (hasSnippets && !expanded) {
    html += '<div class="snippet">' + renderParas(m.paras, q, only) + "</div>";
  }
  html += '<div class="full">' + renderParas(m.paras, q, null) + "</div>";
  if (m.paras.length) {
    html += '<button type="button" class="toggle" data-toggle="1">' + (expanded ? "Hide full entry" : "Show full entry") + "</button>";
  }
  html += "</article>";
  return html;
}

function renderResults(result, append) {
  const box = document.getElementById("results");
  const status = document.getElementById("status");
  document.getElementById("searchWrap").classList.toggle("has-query", !!(result && result.q));

  if (!result || result.type === "empty") {
    status.innerHTML = "Type a word to search all <strong>" + state.data.cats.length.toLocaleString() + "</strong> categories, or browse the classes at the left.";
    box.innerHTML = '<div class="empty"><h2>Look up an idea, then find the words for it.</h2><p>Try <button type="button" class="word" data-q="happy">happy</button>, <button type="button" class="word" data-q="journey">journey</button>, <button type="button" class="word" data-q="existence">existence</button>, or a number such as <button type="button" class="word" data-q="266">266</button>.</p></div>';
    state.current = result;
    state.shown = 0;
    return;
  }
  if (result.type === "none") {
    status.innerHTML = "No matches for <strong>" + esc(result.q) + "</strong>.";
    box.innerHTML = '<div class="empty"><h2>Nothing turned up.</h2><p>Try a shorter word, a category number, or browse the list of classes.</p></div>';
    state.current = result;
    state.shown = 0;
    return;
  }

  const n = result.list.length;
  let lead = "";
  if (result.type === "exact") {
    lead = "<strong>" + n.toLocaleString() + "</strong> categor" + (n === 1 ? "y" : "ies") + " matching <strong>" + esc(result.q) + "</strong>";
  } else if (result.type === "prefix") {
    lead = "No exact match for <strong>" + esc(result.q) + "</strong>. Showing <strong>" + n.toLocaleString() + "</strong> categor" + (n === 1 ? "y" : "ies") + " for words starting with it.";
  } else {
    lead = "No exact match for <strong>" + esc(result.q) + "</strong>. Showing <strong>" + n.toLocaleString() + "</strong> categor" + (n === 1 ? "y" : "ies") + " for partial matches.";
  }
  status.innerHTML = lead;

  const start = append ? state.shown : 0;
  const end = Math.min(n, start + PAGE);
  let html = "";
  if (!append && result.terms && result.terms.length) {
    html += '<div class="term-list">';
    for (const t of result.terms.slice(0, 24)) {
      html += '<button type="button" class="word" data-q="' + esc(t) + '">' + esc(t) + "</button>";
    }
    html += "</div>";
  }
  for (let i = start; i < end; i++) {
    const [ci, hit] = result.list[i];
    const jump = i === 0 && (hit.reasons.has("number") || hit.reasons.has("name-exact"));
    html += cardHtml(ci, hit, result.ql, jump);
  }
  if (append) {
    const more = box.querySelector(".more");
    if (more) more.remove();
    box.insertAdjacentHTML("beforeend", html);
  } else {
    box.innerHTML = html;
  }
  if (end < n) {
    box.insertAdjacentHTML("beforeend", '<button type="button" class="more" data-more="1">Show more (' + (n - end).toLocaleString() + " remaining)</button>");
  }
  state.current = result;
  state.shown = end;
}

function renderCategory(num) {
  const idx = state.byNum.get(String(num).toLowerCase());
  const box = document.getElementById("results");
  const status = document.getElementById("status");
  if (idx == null) {
    status.innerHTML = "No category <strong>" + esc(num) + "</strong>.";
    box.innerHTML = "";
    return;
  }
  const cat = state.data.cats[idx];
  const m = catMeta(cat);
  status.innerHTML = "Category <strong>" + esc(m.num) + ". " + esc(m.name) + "</strong>";
  const fake = { reasons: new Set(["number"]), paras: new Set(), name: true };
  box.innerHTML = cardHtml(idx, fake, "", true);
  highlightTree(cat[0]);
}

function buildTree() {
  const d = state.data;
  const groups = []; // [{ci, label, sections:[{si,label,cats:[]}]}]
  const map = new Map();
  d.cats.forEach((c, i) => {
    const ck = c[2], sk = c[3];
    if (!map.has(ck)) {
      const g = { ci: ck, label: pretty(d.classes[ck]), sections: [], secMap: new Map() };
      map.set(ck, g);
      groups.push(g);
    }
    const g = map.get(ck);
    if (!g.secMap.has(sk)) {
      const s = { si: sk, label: pretty(d.sections[sk]), cats: [] };
      g.secMap.set(sk, s);
      g.sections.push(s);
    }
    g.secMap.get(sk).cats.push(i);
  });
  let html = "";
  for (const g of groups) {
    html += "<details class='cls' data-class='" + g.ci + "'><summary>" + esc(g.label) + "</summary>";
    for (const s of g.sections) {
      html += "<details class='sec' open><summary>" + esc(s.label) + "</summary><ul class='cats'>";
      for (const i of s.cats) {
        const c = d.cats[i];
        html += "<li><button type='button' data-catnum='" + esc(c[0]) + "'><span class='num'>" + esc(c[0]) + "</span>" + esc(c[1]) + "</button></li>";
      }
      html += "</ul></details>";
    }
    html += "</details>";
  }
  document.getElementById("tree").innerHTML = html;
}

function highlightTree(num) {
  document.querySelectorAll(".tree .cats button.active").forEach(b => b.classList.remove("active"));
  const btn = document.querySelector('.tree .cats button[data-catnum="' + CSS.escape(String(num)) + '"]');
  if (btn) {
    btn.classList.add("active");
    const cls = btn.closest("details.cls");
    if (cls) cls.open = true;
    const sec = btn.closest("details.sec");
    if (sec) sec.open = true;
  }
}

function closeSidebar() {
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("backdrop").classList.remove("open");
}

function goSearch(q, push) {
  q = (q || "").trim();
  const hash = q ? "#q=" + encodeURIComponent(q) : "#";
  if (push === false) {
    if (location.hash !== hash && location.hash !== (q ? hash : "")) {
      history.replaceState(null, "", hash || " ");
    }
    applyHash();
  } else if (decodeURIComponent((location.hash || "").replace(/^#q=/, "")) !== q) {
    history.pushState(null, "", hash);
    applyHash();
  } else {
    applyHash();
  }
}

function applyHash() {
  if (!state.ready) return;
  const h = location.hash || "";
  const mCat = h.match(/^#cat=(.+)$/);
  const mQ = h.match(/^#q=(.*)$/);
  if (mCat) {
    const num = decodeURIComponent(mCat[1]);
    document.getElementById("q").value = num;
    document.getElementById("searchWrap").classList.add("has-query");
    renderCategory(num);
    return;
  }
  const q = mQ ? decodeURIComponent(mQ[1]) : "";
  document.getElementById("q").value = q;
  const result = search(q);
  renderResults(result, false);
  if (result && result.list && result.list[0]) {
    highlightTree(state.data.cats[result.list[0][0]][0]);
  }
}

function setTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  try { localStorage.setItem("roget-1911-theme", theme); } catch (e) {}
}
function initTheme() {
  let t = null;
  try { t = localStorage.getItem("roget-1911-theme"); } catch (e) {}
  if (t !== "light" && t !== "dark") {
    t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  setTheme(t);
}

let debounceTimer = null;
function onInput() {
  const q = document.getElementById("q").value;
  document.getElementById("searchWrap").classList.toggle("has-query", !!q.trim());
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    const cur = q.trim();
    const hash = cur ? "#q=" + encodeURIComponent(cur) : "#";
    if (location.hash !== hash) history.pushState(null, "", hash);
    applyHash();
  }, 160);
}

function onClick(ev) {
  const t = ev.target.closest("[data-q], [data-toggle], [data-more], [data-catnum]");
  if (!t) return;
  if (t.dataset.q != null) {
    ev.preventDefault();
    document.getElementById("q").value = t.dataset.q;
    history.pushState(null, "", "#q=" + encodeURIComponent(t.dataset.q));
    applyHash();
    document.getElementById("q").focus();
    closeSidebar();
    return;
  }
  if (t.dataset.toggle) {
    const card = t.closest(".card");
    card.classList.toggle("expanded");
    t.textContent = card.classList.contains("expanded") ? "Hide full entry" : "Show full entry";
    return;
  }
  if (t.dataset.more) {
    renderResults(state.current, true);
    return;
  }
  if (t.dataset.catnum) {
    ev.preventDefault();
    history.pushState(null, "", "#cat=" + encodeURIComponent(t.dataset.catnum));
    applyHash();
    closeSidebar();
  }
}

async function main() {
  const results = document.getElementById("results");
  results.innerHTML = '<div class="loading">Unpacking the thesaurus…</div>';
  try {
    const json = await gunzipB64(GZIP_B64);
    state.data = JSON.parse(json);
    const built = buildIndex(state.data);
    state.index = built.index;
    state.vocab = built.vocab;
    state.byNum = built.byNum;
    state.names = built.names;
    state.ready = true;
    buildTree();
    applyHash();
    // Test hook
    window.__ROGET__ = {
      ready: true,
      search,
      data: state.data,
      index: state.index,
      vocab: state.vocab,
      stats: {
        categories: state.data.cats.length,
        paragraphs: state.data.cats.reduce((n, c) => n + c[4].length, 0),
        terms: state.vocab.length
      }
    };
  } catch (err) {
    document.getElementById("status").textContent = "";
    results.innerHTML = '<div class="error">Could not load the thesaurus. ' + esc(err.message || String(err)) + "</div>";
    throw err;
  }
}

initTheme();
document.getElementById("btnTheme").addEventListener("click", () => {
  setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
});
document.getElementById("q").addEventListener("input", onInput);
document.getElementById("q").addEventListener("keydown", ev => {
  if (ev.key === "Enter") {
    ev.preventDefault();
    clearTimeout(debounceTimer);
    const q = ev.target.value.trim();
    history.pushState(null, "", q ? "#q=" + encodeURIComponent(q) : "#");
    applyHash();
  } else if (ev.key === "Escape") {
    ev.target.value = "";
    history.pushState(null, "", "#");
    applyHash();
  }
});
document.getElementById("btnClear").addEventListener("click", () => {
  document.getElementById("q").value = "";
  history.pushState(null, "", "#");
  applyHash();
  document.getElementById("q").focus();
});
document.addEventListener("click", onClick);
window.addEventListener("hashchange", applyHash);
window.addEventListener("popstate", applyHash);
document.getElementById("btnBrowse").addEventListener("click", () => {
  document.getElementById("sidebar").classList.add("open");
  document.getElementById("backdrop").classList.add("open");
});
document.getElementById("backdrop").addEventListener("click", closeSidebar);
document.addEventListener("keydown", ev => {
  if (ev.key === "/" && ev.target.id !== "q" && !ev.metaKey && !ev.ctrlKey) {
    ev.preventDefault();
    document.getElementById("q").focus();
  }
});

main();
</script>
